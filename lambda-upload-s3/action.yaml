name: 'upload lambda to S3'
description: 'Zip directory and upload to S3'
inputs:
  path:
    description: 'Path to the directory to zip'
    required: true
  name:
    description: 'Name of the lambda'
    required: true
  govcloud:
    description: 'Whether to deploy to GovCloud'
    default: 'true'
  role-name:
    description: 'Name suffix of the role to assume (defaults to the repo name)'
    default: ''
  tag-prefix:
    description: 'Prepended to the SHA-based S3 key (e.g. "dev-" yields "dev-<sha>.zip"). Empty means key is just <sha>.zip. Restricted to [A-Za-z0-9._-]* to keep the prefix in the filename segment.'
    default: ''
runs:
  using: "composite"
  steps:
    - shell: bash
      name: Zip directory
      id: zip
      env:
        # Direct ${{ }} templating into `run:` is shell-injectable: GHA
        # substitutes before bash parses, so $(...) in the value executes
        # despite quotes. Same pattern applies to other env entries below.
        SRC_PATH: ${{ inputs.path }}
      run: |
        error() { echo "$@" >&2; exit 1; }
        MAX_SIZE=262144000

        cd "$SRC_PATH"
        size=$(du -b -s . | cut -f 1)
        [[ $size -lt $MAX_SIZE ]] || error "The package size is too large: $size; must be smaller than $MAX_SIZE. Consider using docker-based deployment."

        TMPNAME=$(mktemp)
        zip -r - . > "$TMPNAME"

        echo "zip-path=$TMPNAME" >> "$GITHUB_OUTPUT"
    - shell: bash
      name: Compute role name suffix
      id: role-name
      env:
        ROLE_NAME: ${{ inputs.role-name }}
      run: |
        REPO="${GITHUB_REPOSITORY#*/}"
        echo "role-name=${ROLE_NAME:-$REPO}" >> "$GITHUB_OUTPUT"
    - name: Configure AWS credentials from Prod account
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::730278974607:role/github/GitHub-${{ steps.role-name.outputs.role-name }}
        aws-region: us-east-1
    - shell: bash
      name: Upload zip to prod S3
      env:
        LAMBDA_NAME: ${{ inputs.name }}
        TAG_PREFIX: ${{ inputs.tag-prefix }}
        SHA: ${{ github.sha }}
      run: ${{ github.action_path }}/upload_s3.sh "${{ steps.zip.outputs.zip-path }}" "$LAMBDA_NAME" "$SHA" us-east-1 "$TAG_PREFIX"
    - if: ${{ inputs.govcloud  == 'true' }}
      name: Configure AWS credentials from GovCloud account
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws-us-gov:iam::313325871032:role/github/GitHub-${{ steps.role-name.outputs.role-name }}
        aws-region: us-gov-east-1
    - if: ${{ inputs.govcloud  == 'true' }}
      shell: bash
      name: Upload zip to GovCloud S3
      env:
        LAMBDA_NAME: ${{ inputs.name }}
        TAG_PREFIX: ${{ inputs.tag-prefix }}
        SHA: ${{ github.sha }}
      run: ${{ github.action_path }}/upload_s3.sh "${{ steps.zip.outputs.zip-path }}" "$LAMBDA_NAME" "$SHA" us-gov-east-1 "$TAG_PREFIX"
